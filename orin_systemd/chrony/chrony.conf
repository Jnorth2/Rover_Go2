# Jetson chrony config: track the groundstation laptop only.
# Replaces the stock /etc/chrony/chrony.conf (drops the internet pools so the
# Jetson never disagrees with the laptop).
#
# Install:
#   sudo cp orin_systemd/chrony/chrony.conf /etc/chrony/chrony.conf
#   sudo systemctl restart chrony

# Groundstation laptop on the wired link; poll every 4-16 s
server 192.168.123.100 iburst minpoll 2 maxpoll 4

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony

# Step the clock if it is off by more than 0.5 s, at any time (not just at
# boot) -- the laptop may only come online after the Jetson has booted.
# Smaller errors are slewed so running ROS nodes don't see time jumps.
makestep 0.5 -1

# Copy system time to the RTC
rtcsync
