# Laptop (groundstation) acts as the time server for the Go2 subnet.
# The laptop syncs to internet NTP over wifi as usual and serves that
# time to the Jetson over the wired 192.168.123.0/24 link.
#
# Install:
#   sudo cp groundstation/chrony/go2-timeserver.conf /etc/chrony/conf.d/
#   sudo systemctl restart chrony

# Let the Go2 subnet (Jetson at 192.168.123.99) query us
allow 192.168.123.0/24

# Keep serving time when the laptop has no internet (e.g. in the field)
local stratum 10
