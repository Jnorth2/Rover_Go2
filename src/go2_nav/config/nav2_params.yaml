# Nav2 parameters for the Go2 (Jazzy). Launched by navigation.launch.py.
#
# Localization comes from RTAB-Map (map → odom) and the EKF (odom → base_link);
# there is no AMCL / map_server. The global costmap's static layer follows the
# /map that RTAB-Map grows while mapping.
#
# Obstacles come from the UTlidar cloud, split by rtabmap_util/obstacles_detection
# into /utlidar/obstacles and /utlidar/ground (ground removed by surface normals in
# the robot frame, so slopes and body pitch don't mark the floor as obstacles). Because
# that split is already done, the costmap height filters below are wide open: they
# are evaluated in the costmap's global frame (odom / map), whose z is not the
# floor height.
#
# Velocity chain (remaps in navigation.launch.py):
#   controller_server / behavior_server → cmd_vel_nav → velocity_smoother
#   → cmd_vel_smoothed → collision_monitor → /cmd_vel → go2_joy_teleop
#   → /api/sport/request (Move). The joystick overrides /cmd_vel when deflected.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # 10 Hz keeps MPPI affordable on the Orin Nano; model_dt below must match
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    # Go2 strafes, so lateral commands must not be zeroed (diff-drive default is 0.5)
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 30 steps × 0.1 s = 3 s horizon; batch halved from the default for the Orin Nano
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      motion_model: "Omni"
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.3
      wz_max: 1.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 1.5
      ay_min: -1.5
      az_max: 2.0
      # Must exceed vx_max × horizon (1.5 m)
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      # Trajectory markers are heavy to compute and to send over the radio link
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        # The Go2 footprint is a long rectangle, not a circle
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # Omni robots otherwise tend to spin while translating
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Go2 standing, legs included, around base_link (trunk centre)
      footprint: "[[0.38, 0.22], [0.38, -0.22], [-0.38, -0.22], [-0.38, 0.22]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        min_obstacle_height: -10.0
        max_obstacle_height: 10.0
        observation_sources: obstacles ground
        obstacles:
          topic: /utlidar/obstacles
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
        # Ground points only clear: they are the rays that pass through free space
        ground:
          topic: /utlidar/ground
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      # Matches RTAB-Map Grid/CellSize
      resolution: 0.05
      footprint: "[[0.38, 0.22], [0.38, -0.22], [-0.38, -0.22], [-0.38, 0.22]]"
      footprint_padding: 0.03
      # The map starts empty, so plans have to cross unknown space
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        min_obstacle_height: -10.0
        max_obstacle_height: 10.0
        observation_sources: obstacles ground
        obstacles:
          topic: /utlidar/obstacles
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_min_range: 0.0
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
        ground:
          topic: /utlidar/ground
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_min_range: 0.0
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # Send only changed regions over the radio link; RViz applies the updates
      always_send_full_costmap: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # [vx, vy, wz]; keep within the MPPI limits above
    max_velocity: [0.5, 0.3, 1.0]
    min_velocity: [-0.3, -0.3, -1.0]
    max_accel: [1.5, 1.5, 2.0]
    max_decel: [-1.5, -1.5, -2.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 4
      visualize: False
      enabled: True
    observation_sources: ["obstacles"]
    # Heights are in base_link here (trunk centre, ~0.3 m above the floor):
    # -0.15 ignores anything lower than ~15 cm off the ground.
    obstacles:
      type: "pointcloud"
      topic: "/utlidar/obstacles"
      min_height: -0.15
      max_height: 1.0
      enabled: True
