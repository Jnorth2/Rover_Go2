rtabmap:
  ros__parameters:
    frame_id: "base_link"
    # With odom_frame_id set, RTAB-Map reads odometry from TF (odom → base_link
    # published by the EKF) rather than from the odom topic.
    odom_frame_id: "odom"
    map_frame_id: "map"

    # Publish map → odom correction TF every tf_delay seconds, stamped
    # tf_tolerance seconds into the future.
    publish_tf: true
    tf_delay: 0.05
    tf_tolerance: 0.1

    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan_cloud: true

    approx_sync: true
    wait_for_transform: 0.3
    sync_queue_size: 50
    topic_queue_size: 50

    # ICP registration, constrained to 2D (x, y, yaw)
    Reg/Force3DoF: "true"
    Reg/Strategy: "1"
    # NOTE: misspelled ("Nomrals"), so RTAB-Map ignores it. The real parameter is
    # Icp/PointToPlaneGroundNormalsUp. Kept as-is to match previous behavior.
    Icp/PointToPlaneGroundNomralsUp: "0.9"
    Optimizer/GravitySigma: "0"

    # Lidar-only SLAM: disable visual feature extraction
    # (re-enabled by rtabmap_camera.yaml when the camera is used)
    Vis/MaxFeatures: "0"

    # Occupancy grid (5 cm cells) built from the scan cloud, with ground
    # segmentation by surface normals. rtabmap_camera.yaml switches Grid/Sensor
    # to lidar + depth camera when the camera is used.
    RGBD/CreateOccupancyGrid: "true"
    Grid/CellSize: "0.05"
    Grid/RayTracing: "true"
    Grid/Sensor: "0"
    Grid/FromDepth: "false"
    # 3D occupancy (OctoMap: /octomap_full, /octomap_occupied_space). The 2D /map
    # is still published as a projection. The 3D point cloud map is /cloud_map,
    # or /mapData for the rtabmap_rviz_plugins MapCloud display.
    Grid/3D: "true"
    Grid/RangeMax: "20"
    Grid/NormalsSegmentation: "true"
    Grid/NormalK: "20"
    Grid/MaxGroundAngle: "45"
    Grid/MinGroundHeight: "0.0"
    Grid/MaxGroundHeight: "0.0"
    Grid/MaxObstacleHeight: "1.5"
    Grid/ClusterRadius: "0.15"
